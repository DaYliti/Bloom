<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bloom</title>
<style>
  :root{
    --fg:#f6ebef;
    --dim:#8d7c86;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#000;}
  body{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color:var(--fg);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  #video-bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    z-index: 1;
    transition: opacity 3s ease;
  }
  
  body.opened #video-bg { opacity: 0.15; }

  /* ---------- Контейнер для кнопки ---------- */
  #ui{
    position:fixed; inset:0;
    display:grid; place-items:center;
    opacity:0; pointer-events:none;
    transition:opacity 1.4s ease;
    z-index:5;
  }
  #ui.show{ opacity:1; pointer-events:auto; }

  /* ---------- Кнопка-контейнер ---------- */
  #open-btn {
    position: relative;
    width: 180px;
    height: 55px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.3); /* Белый контур */
    background: rgba(255,255,255,.02);
    backdrop-filter: blur(4px);
    transform: translateY(38px); 
    cursor: default; /* Убрали курсор-палец */
    overflow: hidden; /* Обрезаем всё лишнее */
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.3s;
  }

  /* Слой с жидкостью */
  .liquid {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 0%; /* Изначально пусто */
    background: #ff6b9e;
    /* Розовый контур для боков и низа, чтобы перекрыть белый */
    box-shadow: inset 1px 0 0 #ff6b9e, inset -1px 0 0 #ff6b9e, inset 0 -1px 0 #ff6b9e;
    border-radius: 0 0 18px 18px;
    transition: height 4.5s cubic-bezier(0.4, 0.0, 0.2, 1); /* Медленное заполнение */
    z-index: 1;
  }

  /* Волны (два вращающихся круга) */
  .wave {
    position: absolute;
    top: -40px;
    left: -50%;
    width: 200%;
    height: 80px;
    border-radius: 40%;
    animation: spin 4s linear infinite;
  }
  .wave1 {
    background: #ff6b9e;
  }
  .wave2 {
    background: #ff8fb6; /* Чуть светлее для объема */
    top: -45px;
    border-radius: 45%;
    animation: spin 5s linear infinite reverse;
    opacity: 0.7;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Текст внутри кнопки */
  .btn-text {
    position: relative;
    z-index: 2;
    font-size: 13px;
    letter-spacing: .4em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3); /* Тень для читаемости */
    pointer-events: none;
    transition: color 0.5s;
  }

  /* Состояние при наведении */
  #open-btn.filling .liquid {
    height: 100%;
  }

  /* ---------- Лепестки сакуры ---------- */
  #petals-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10; 
    overflow: hidden;
  }
  .petal {
    position: absolute;
    background: linear-gradient(135deg, #ffb7c5, #ff6b9e);
    border-radius: 15px 2px 15px 2px;
    opacity: 1;
    box-shadow: 0 0 8px rgba(255, 107, 158, 0.5);
    transform: translate(-50%, -50%) scale(var(--scale)) rotate(0deg);
  }

  /* ---------- Био страница ---------- */
  #bio{
    position:fixed; inset:0;
    display:grid; place-items:center;
    z-index:4;
    padding:32px;
  }

  .inner{
    text-align:center;
    max-width:520px;
  }

  .inner h1, .inner .tag, .inner nav {
    opacity: 0;
    transform: translateY(40px) scale(0.8);
    filter: blur(12px);
    transition: all 3s cubic-bezier(0.1, 0.8, 0.2, 1);
  }

  body.opened .inner h1 { 
    opacity: 1; transform: translateY(0) scale(1); filter: blur(0); transition-delay: 0.1s;
  }
  body.opened .inner .tag { 
    opacity: 1; transform: translateY(0) scale(1); filter: blur(0); transition-delay: 0.3s;
  }
  body.opened .inner nav { 
    opacity: 1; transform: translateY(0) scale(1); filter: blur(0); transition-delay: 0.5s;
  }

  .inner h1{
    margin:0 0 18px;
    font-size:clamp(26px,5vw,40px);
    font-weight:600;
    letter-spacing:.14em;
    text-transform:lowercase;
    color:#fff;
    text-shadow:0 0 40px rgba(255,110,150,.35);
  }
  .tag{
    margin:0 0 46px;
    font-size:12px;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--dim);
  }
  nav{
    display:flex; gap:26px; justify-content:center; flex-wrap:wrap;
  }
  nav a{
    color:var(--fg);
    text-decoration:none;
    font-size:12px;
    letter-spacing:.28em;
    text-transform:uppercase;
    padding-bottom:5px;
    border-bottom:1px solid rgba(255,120,160,.18);
    transition:all .35s ease;
    opacity:.75;
  }
  nav a:hover{
    opacity:1;
    color:#fff;
    border-bottom-color:#fff;
    text-shadow:0 0 20px rgba(255,255,255,.7);
  }
</style>
</head>
<body>

<video id="video-bg" src="Intro.mp4" autoplay muted playsinline></video>

<div id="ui">
  <!-- Кнопка теперь div, так как клик не нужен -->
  <div id="open-btn">
    <div class="liquid">
      <div class="wave wave1"></div>
      <div class="wave wave2"></div>
    </div>
    <span class="btn-text">Open</span>
  </div>
</div>

<div id="petals-container"></div>

<main id="bio">
  <div class="inner">
    <h1>имя</h1>
    <p class="tag">let it bloom</p>
    <nav>
      <a href="#" target="_blank" rel="noopener">telegram</a>
      <a href="#" target="_blank" rel="noopener">github</a>
      <a href="mailto:">mail</a>
    </nav>
  </div>
</main>

<script>
  const video = document.getElementById('video-bg');
  const ui = document.getElementById('ui');
  const openBtn = document.getElementById('open-btn');
  const petalsContainer = document.getElementById('petals-container');

  video.addEventListener('ended', () => {
    ui.classList.add('show');
  });

  function spawnPetals(x, y) {
    const petalCount = 80;
    for (let i = 0; i < petalCount; i++) {
      const petal = document.createElement('div');
      petal.classList.add('petal');
      const size = Math.random() * 15 + 10;
      petal.style.width = `${size}px`;
      petal.style.height = `${size}px`;
      petal.style.left = `${x}px`;
      petal.style.top = `${y}px`;

      const angle = Math.random() * Math.PI * 2;
      const distance = Math.random() * (Math.max(window.innerWidth, window.innerHeight) * 0.6) + 150;
      const tx = Math.cos(angle) * distance;
      const ty = Math.sin(angle) * distance - 50;
      const rot = Math.random() * 1080 - 540;
      const scale = Math.random() * 0.6 + 0.4;
      const duration = Math.random() * 3 + 5; 

      petal.style.setProperty('--scale', scale);
      petalsContainer.appendChild(petal);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          petal.style.transition = `transform ${duration}s cubic-bezier(0.1, 0.7, 0.2, 1), opacity ${duration}s ease-out`;
          petal.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(${scale}) rotate(${rot}deg)`;
          petal.style.opacity = '0';
        });
      });

      setTimeout(() => { petal.remove(); }, duration * 1000 + 100);
    }
  }

  let fillTimeout = null;
  let isAnimating = false;

  // Время заполнения водой (в миллисекундах) — 4.5 секунды
  const FILL_DURATION = 4500; 
  // Пауза после заполнения (1 секунда)
  const DELAY_AFTER_FILL = 1000; 

  openBtn.addEventListener('mouseenter', () => {
    if (isAnimating) return;

    const rect = openBtn.getBoundingClientRect();
    const btnX = rect.left + rect.width / 2;
    const btnY = rect.top + rect.height / 2;

    // Запускаем CSS-анимацию заполнения
    openBtn.classList.add('filling');

    // Ждем, пока вода заполнится, плюс 1 секунду паузы
    fillTimeout = setTimeout(() => {
      isAnimating = true;
      
      // 1. Лепестки
      spawnPetals(btnX, btnY);

      // 2. Убираем кнопку
      ui.classList.remove('show');
      setTimeout(() => { ui.style.display = 'none'; }, 400);

      // 3. Появление текста
      document.body.classList.add('opened');
      
    }, FILL_DURATION + DELAY_AFTER_FILL); 
  });

  openBtn.addEventListener('mouseleave', () => {
    if (isAnimating) return;
    // Если убрали мышку, вода сливается обратно (CSS сделает это плавно)
    openBtn.classList.remove('filling');
    clearTimeout(fillTimeout);
  });
</script>
</body>
</html>
