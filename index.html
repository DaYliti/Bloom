<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bloom</title>
<style>
  :root{
    --fg:#f6ebef;
    --dim:#8d7c86;
    --accent:#ff6f9c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#000;}
  body{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color:var(--fg);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* Контейнер для видео на заднем фоне */
  #video-bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover; /* Чтобы видео заполняло весь экран */
    z-index: 1;
    transition: opacity 2s ease;
  }
  
  /* Когда сайт открыт (кнопка Open нажата), видео становится полупрозрачным */
  body.opened #video-bg { opacity: 0.18; }

  /* ---------- Кнопка Open ---------- */
  #ui{
    position:fixed; inset:0;
    display:grid; place-items:center;
    opacity:0; pointer-events:none;
    transition:opacity 1.4s ease;
    z-index:5;
  }
  #ui.show{ opacity:1; pointer-events:auto; }

  #open{
    appearance:none;
    background:rgba(255,80,140,.03);
    color:#ffd9e4;
    border:1px solid rgba(255,120,160,.35);
    border-radius:999px;
    padding:15px 46px;
    font:inherit;
    font-size:13px;
    letter-spacing:.42em;
    text-transform:uppercase;
    cursor:pointer;
    transition:all .45s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 0 34px rgba(255,80,140,.12), inset 0 0 22px rgba(255,80,140,.05);
    backdrop-filter:blur(3px);
  }
  #open:hover, #open:focus-visible{
    outline:none;
    color:#fff;
    border-color:rgba(255,160,195,.9);
    letter-spacing:.55em;
    background:rgba(255,80,140,.07);
    box-shadow:0 0 60px rgba(255,80,140,.4), inset 0 0 34px rgba(255,80,140,.13);
  }

  /* ---------- Био ---------- */
  #bio{
    position:fixed; inset:0;
    display:grid; place-items:center;
    opacity:0; pointer-events:none;
    transition:opacity 1.6s ease .25s;
    z-index:4;
    padding:32px;
  }
  body.opened #bio{ opacity:1; pointer-events:auto; }

  .inner{
    text-align:center;
    max-width:520px;
    transform:translateY(14px);
    transition:transform 1.6s cubic-bezier(.2,.8,.2,1) .25s;
  }
  body.opened .inner{ transform:translateY(0); }

  .inner h1{
    margin:0 0 18px;
    font-size:clamp(26px,5vw,40px);
    font-weight:600;
    letter-spacing:.14em;
    text-transform:lowercase;
    color:#fff;
    text-shadow:0 0 40px rgba(255,110,150,.35);
  }
  .tag{
    margin:0 0 46px;
    font-size:12px;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--dim);
  }
  nav{
    display:flex; gap:26px; justify-content:center; flex-wrap:wrap;
  }
  nav a{
    color:var(--fg);
    text-decoration:none;
    font-size:12px;
    letter-spacing:.28em;
    text-transform:uppercase;
    padding-bottom:5px;
    border-bottom:1px solid rgba(255,120,160,.18);
    transition:all .35s ease;
    opacity:.75;
  }
  nav a:hover{
    opacity:1;
    color:#fff;
    border-bottom-color:var(--accent);
    text-shadow:0 0 20px rgba(255,110,150,.7);
  }
</style>
</head>
<body>

<!-- Твое видео. Атрибуты autoplay и muted нужны для автоматического запуска -->
<video id="video-bg" src="Intro.mp4" autoplay muted playsinline></video>

<div id="ui"><button id="open">Open</button></div>

<main id="bio">
  <div class="inner">
    <!-- ТУТ МОЖЕШЬ ПОМЕНЯТЬ ИМЯ И ССЫЛКИ -->
    <h1>имя</h1>
    <p class="tag">let it bloom</p>
    <nav>
      <a href="#" target="_blank" rel="noopener">telegram</a>
      <a href="#" target="_blank" rel="noopener">github</a>
      <a href="mailto:">mail</a>
    </nav>
  </div>
</main>

<script>
  const video = document.getElementById('video-bg');
  const ui = document.getElementById('ui');
  const openBtn = document.getElementById('open');

  // Когда видео доиграет до конца (10 секунд), появляется кнопка Open
  video.addEventListener('ended', () => {
    ui.classList.add('show');
  });

  // Когда пользователь нажимает Open:
  openBtn.addEventListener('click', () => {
    // Включаем класс opened (видео тускнеет, появляется био)
    document.body.classList.add('opened');
    // Прячем кнопку
    ui.classList.remove('show');
    setTimeout(() => { ui.style.display = 'none'; }, 1500);
  });
</script>
</body>
</html>
