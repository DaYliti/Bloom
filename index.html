<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bloom</title>
<style>
  :root{
    --fg:#f6ebef;
    --dim:#8d7c86;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#000;}
  body{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color:var(--fg);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* Видео на фоне */
  #video-bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain; /* Сохраняет пропорции, не растягивает */
    z-index: 1;
    transition: opacity 2s ease;
  }
  
  body.opened #video-bg { opacity: 0.15; }

  /* ---------- Контейнер для кнопки ---------- */
  #ui{
    position:fixed; inset:0;
    display:grid; place-items:center;
    opacity:0; pointer-events:none;
    transition:opacity 1.4s ease;
    z-index:5;
  }
  #ui.show{ opacity:1; pointer-events:auto; }

  /* ---------- Кнопка Open ---------- */
  #open{
    appearance:none;
    background:rgba(255,255,255,.02);
    color:rgba(255,255,255,.85);
    border:1px solid rgba(255,255,255,.3);
    border-radius:18px; /* Средняя форма между овалом и прямоугольником */
    transform: translateY(38px); /* Опускаем кнопку на ~1 см вниз */
    padding:16px 50px;
    font:inherit;
    font-size:13px;
    letter-spacing:.4em;
    text-transform:uppercase;
    cursor:pointer;
    transition:all .4s ease;
    box-shadow:0 0 20px rgba(255,255,255,.05);
    backdrop-filter:blur(4px);
  }
  
  #open:hover, #open:focus-visible{
    outline:none;
    color:#000;
    background:rgba(255,255,255,.95);
    border-color:#fff;
    letter-spacing:.45em;
    transform: translateY(38px) scale(1.03); /* Чуть увеличивается при наведении */
    box-shadow:0 0 30px rgba(255,255,255,.3);
  }

  /* ---------- Лепестки сакуры ---------- */
  #petals-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10; /* Поверх всего, чтобы лепестки красиво разлетались */
    overflow: hidden;
  }
  .petal {
    position: absolute;
    /* Красивый розовый градиент для лепестка */
    background: linear-gradient(135deg, #ffb7c5, #ff6b9e);
    /* Форма лепестка сакуры (закругленные углы с одной стороны) */
    border-radius: 15px 2px 15px 2px;
    opacity: 1;
    box-shadow: 0 0 5px rgba(255, 107, 158, 0.4);
    /* Начальная позиция (центр кнопки) */
    transform: translate(-50%, -50%) scale(var(--scale)) rotate(0deg);
  }

  /* ---------- Био страница ---------- */
  #bio{
    position:fixed; inset:0;
    display:grid; place-items:center;
    opacity:0; pointer-events:none;
    transition:opacity 1.6s ease .25s;
    z-index:4;
    padding:32px;
  }
  body.opened #bio{ opacity:1; pointer-events:auto; }

  .inner{
    text-align:center;
    max-width:520px;
    transform:translateY(14px);
    transition:transform 1.6s cubic-bezier(.2,.8,.2,1) .25s;
  }
  body.opened .inner{ transform:translateY(0); }

  .inner h1{
    margin:0 0 18px;
    font-size:clamp(26px,5vw,40px);
    font-weight:600;
    letter-spacing:.14em;
    text-transform:lowercase;
    color:#fff;
    text-shadow:0 0 40px rgba(255,110,150,.35);
  }
  .tag{
    margin:0 0 46px;
    font-size:12px;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--dim);
  }
  nav{
    display:flex; gap:26px; justify-content:center; flex-wrap:wrap;
  }
  nav a{
    color:var(--fg);
    text-decoration:none;
    font-size:12px;
    letter-spacing:.28em;
    text-transform:uppercase;
    padding-bottom:5px;
    border-bottom:1px solid rgba(255,120,160,.18);
    transition:all .35s ease;
    opacity:.75;
  }
  nav a:hover{
    opacity:1;
    color:#fff;
    border-bottom-color:#fff;
    text-shadow:0 0 20px rgba(255,255,255,.7);
  }
</style>
</head>
<body>

<video id="video-bg" src="Intro.mp4" autoplay muted playsinline></video>

<div id="ui"><button id="open">Open</button></div>

<!-- Контейнер для лепестков -->
<div id="petals-container"></div>

<main id="bio">
  <div class="inner">
    <h1>имя</h1>
    <p class="tag">let it bloom</p>
    <nav>
      <a href="#" target="_blank" rel="noopener">telegram</a>
      <a href="#" target="_blank" rel="noopener">github</a>
      <a href="mailto:">mail</a>
    </nav>
  </div>
</main>

<script>
  const video = document.getElementById('video-bg');
  const ui = document.getElementById('ui');
  const openBtn = document.getElementById('open');
  const petalsContainer = document.getElementById('petals-container');

  // Показываем кнопку после окончания видео
  video.addEventListener('ended', () => {
    ui.classList.add('show');
  });

  // Функция для создания лепестков
  function spawnPetals(x, y) {
    const petalCount = 45; // Количество лепестков

    for (let i = 0; i < petalCount; i++) {
      const petal = document.createElement('div');
      petal.classList.add('petal');

      // Случайный размер
      const size = Math.random() * 12 + 8; // от 8 до 20 px
      petal.style.width = `${size}px`;
      petal.style.height = `${size}px`;

      // Начальная позиция — центр кнопки
      petal.style.left = `${x}px`;
      petal.style.top = `${y}px`;

      // Случайный угол и дистанция разлета (до краев экрана)
      const angle = Math.random() * Math.PI * 2;
      const distance = Math.random() * (Math.max(window.innerWidth, window.innerHeight) * 0.6) + 150;
      const tx = Math.cos(angle) * distance;
      const ty = Math.sin(angle) * distance;

      // Случайный поворот и масштаб для естественности
      const rot = Math.random() * 720 - 360;
      const scale = Math.random() * 0.6 + 0.4;

      // Передаем значения в CSS-переменные
      petal.style.setProperty('--scale', scale);

      petalsContainer.appendChild(petal);

      // Запускаем анимацию на следующем кадре (чтобы браузер применил начальные стили)
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          // Плавно двигаем к краям и растворяем
          petal.style.transition = `transform 2.5s cubic-bezier(0.15, 0.8, 0.3, 1), opacity 2.5s ease-in`;
          petal.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(${scale}) rotate(${rot}deg)`;
          petal.style.opacity = '0'; // Лепесток испаряется
        });
      });

      // Удаляем из DOM через 2.6 секунды, чтобы не засорять память
      setTimeout(() => {
        petal.remove();
      }, 2600);
    }
  }

  // Обработка клика по кнопке
  openBtn.addEventListener('click', () => {
    // 1. Получаем координаты центра кнопки
    const rect = openBtn.getBoundingClientRect();
    const btnX = rect.left + rect.width / 2;
    const btnY = rect.top + rect.height / 2;

    // 2. Запускаем лепестки
    spawnPetals(btnX, btnY);

    // 3. Убираем кнопку
    ui.classList.remove('show');
    setTimeout(() => { ui.style.display = 'none'; }, 400);

    // 4. Включаем режим открытого сайта (текст начинает появляться)
    // Задержку в 200мс делаем, чтобы лепестки успели вылететь чуть раньше текста
    setTimeout(() => {
      document.body.classList.add('opened');
    }, 200);
  });
</script>
</body>
</html>
