<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bloom</title>
<style>
  :root{
    --fg:#f6ebef;
    --dim:#8d7c86;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#000;}
  body{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color:var(--fg);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  #video-bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    z-index: 1;
    transition: opacity 3s ease;
  }
  
  body.opened #video-bg { opacity: 0.15; }

  /* ---------- Контейнер для кнопки ---------- */
  #ui{
    position:fixed; inset:0;
    display:grid; place-items:center;
    opacity:0; pointer-events:none;
    transition:opacity 1.4s ease;
    z-index:5;
  }
  #ui.show{ opacity:1; pointer-events:auto; }

  /* ---------- Кнопка-контейнер ---------- */
  #open-btn {
    position: relative;
    width: 190px;
    height: 55px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.3);
    background: transparent;
    backdrop-filter: blur(4px);
    transform: translateY(38px); 
    cursor: default; 
    overflow: hidden; 
    display: flex;
    justify-content: center;
    align-items: center;
    transition: border-color 4s linear;
  }

  /* Слой с жидкостью */
  .liquid {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 0%; 
    background: #ff6b9e;
    opacity: 0;
    transition: height 4s linear, opacity 0.3s ease;
    z-index: 1;
  }

  /* Аккуратная волна */
  .liquid::before {
    content: '';
    position: absolute;
    top: -6px;
    left: -10%;
    width: 120%;
    height: 12px;
    background: #ff6b9e;
    border-radius: 50%;
    animation: wobble 2.5s infinite alternate ease-in-out;
  }

  @keyframes wobble {
    0% { transform: translateX(-3%); }
    100% { transform: translateX(3%); }
  }

  /* Обертка для текста (идеально центрируется благодаря flex) */
  .text-wrapper {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .text-open, .text-typing {
    font-size: 13px;
    letter-spacing: .4em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }

  /* Текст, который печатается */
  .text-typing {
    width: 0;
    overflow: hidden;
    white-space: nowrap;
    transition: width 0.3s ease;
    display: inline-block;
    text-align: left;
  }

  /* Состояние при наведении */
  #open-btn.filling {
    border-color: #ff6b9e;
  }

  #open-btn.filling .liquid {
    height: 100%;
    opacity: 1; 
  }

  /* Расширяем контейнер для текста, заставляя "Open" отъехать влево */
  #open-btn.filling .text-typing {
    width: 80px; /* Место для "ing..." */
  }

  /* ---------- Лепестки сакуры ---------- */
  #petals-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10; 
    overflow: hidden;
  }
  .petal {
    position: absolute;
    background: linear-gradient(135deg, #ffb7c5, #ff6b9e);
    border-radius: 15px 2px 15px 2px;
    opacity: 1;
    box-shadow: 0 0 8px rgba(255, 107, 158, 0.5);
    transform: translate(-50%, -50%) scale(var(--scale)) rotate(0deg);
  }

  /* ---------- Био страница ---------- */
  #bio{
    position:fixed; inset:0;
    display:grid; place-items:center;
    z-index:4;
    padding:32px;
  }

  .inner{
    text-align:center;
    max-width:520px;
  }

  .inner h1, .inner .tag, .inner nav {
    opacity: 0;
    transform: translateY(40px) scale(0.8);
    filter: blur(12px);
    transition: all 3s cubic-bezier(0.1, 0.8, 0.2, 1);
  }

  body.opened .inner h1 { 
    opacity: 1; transform: translateY(0) scale(1); filter: blur(0); transition-delay: 0.1s;
  }
  body.opened .inner .tag { 
    opacity: 1; transform: translateY(0) scale(1); filter: blur(0); transition-delay: 0.3s;
  }
  body.opened .inner nav { 
    opacity: 1; transform: translateY(0) scale(1); filter: blur(0); transition-delay: 0.5s;
  }

  .inner h1{
    margin:0 0 18px;
    font-size:clamp(26px,5vw,40px);
    font-weight:600;
    letter-spacing:.14em;
    text-transform:lowercase;
    color:#fff;
    text-shadow:0 0 40px rgba(255,110,150,.35);
  }
  .tag{
    margin:0 0 46px;
    font-size:12px;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--dim);
  }
  nav{
    display:flex; gap:26px; justify-content:center; flex-wrap:wrap;
  }
  nav a{
    color:var(--fg);
    text-decoration:none;
    font-size:12px;
    letter-spacing:.28em;
    text-transform:uppercase;
    padding-bottom:5px;
    border-bottom:1px solid rgba(255,120,160,.18);
    transition:all .35s ease;
    opacity:.75;
  }
  nav a:hover{
    opacity:1;
    color:#fff;
    border-bottom-color:#fff;
    text-shadow:0 0 20px rgba(255,255,255,.7);
  }
</style>
</head>
<body>

<video id="video-bg" src="Intro.mp4" autoplay muted playsinline></video>

<div id="ui">
  <div id="open-btn">
    <div class="liquid"></div>
    <div class="text-wrapper">
      <span class="text-open">Open</span><span class="text-typing"></span>
    </div>
  </div>
</div>

<div id="petals-container"></div>

<main id="bio">
  <div class="inner">
    <h1>имя</h1>
    <p class="tag">let it bloom</p>
    <nav>
      <a href="#" target="_blank" rel="noopener">telegram</a>
      <a href="#" target="_blank" rel="noopener">github</a>
      <a href="mailto:">mail</a>
    </nav>
  </div>
</main>

<script>
  const video = document.getElementById('video-bg');
  const ui = document.getElementById('ui');
  const openBtn = document.getElementById('open-btn');
  const textTyping = document.querySelector('.text-typing');
  const petalsContainer = document.getElementById('petals-container');

  video.addEventListener('ended', () => {
    ui.classList.add('show');
  });

  function spawnPetals(x, y) {
    const petalCount = 80;
    for (let i = 0; i < petalCount; i++) {
      const petal = document.createElement('div');
      petal.classList.add('petal');
      const size = Math.random() * 15 + 10;
      petal.style.width = `${size}px`;
      petal.style.height = `${size}px`;
      petal.style.left = `${x}px`;
      petal.style.top = `${y}px`;

      const angle = Math.random() * Math.PI * 2;
      const distance = Math.random() * (Math.max(window.innerWidth, window.innerHeight) * 0.6) + 150;
      const tx = Math.cos(angle) * distance;
      const ty = Math.sin(angle) * distance - 50;
      const rot = Math.random() * 1080 - 540;
      const scale = Math.random() * 0.6 + 0.4;
      const duration = Math.random() * 3 + 5; 

      petal.style.setProperty('--scale', scale);
      petalsContainer.appendChild(petal);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          petal.style.transition = `transform ${duration}s cubic-bezier(0.1, 0.7, 0.2, 1), opacity ${duration}s ease-out`;
          petal.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(${scale}) rotate(${rot}deg)`;
          petal.style.opacity = '0';
        });
      });

      setTimeout(() => { petal.remove(); }, duration * 1000 + 100);
    }
  }

  let fillTimeout = null;
  let isAnimating = false;
  let typingTimeout = null;

  function startTyping() {
    clearTimeout(typingTimeout);
    textTyping.textContent = "";
    const fullText = "ing...";
    let charIndex = 0;

    function typeChar() {
      if (charIndex < fullText.length) {
        textTyping.textContent += fullText[charIndex];
        charIndex++;
        
        // Буквы печатаются быстро (100мс), а точки медленно (300мс)
        let delay = (charIndex > 3) ? 300 : 100; 
        typingTimeout = setTimeout(typeChar, delay);
      } else {
        // Когда напечатаны все точки, ждем и начинаем печатать их заново
        typingTimeout = setTimeout(() => {
          textTyping.textContent = "ing"; 
          charIndex = 3; 
          typeChar();
        }, 800);
      }
    }
    typeChar();
  }

  function stopTyping() {
    clearTimeout(typingTimeout);
    textTyping.textContent = "";
  }

  const FILL_DURATION = 4000; // 4 секунды

  openBtn.addEventListener('mouseenter', () => {
    if (isAnimating) return;

    const rect = openBtn.getBoundingClientRect();
    const btnX = rect.left + rect.width / 2;
    const btnY = rect.top + rect.height / 2;

    openBtn.classList.add('filling');
    startTyping();

    // Таймер ровно на 4 секунды (без задержек)
    fillTimeout = setTimeout(() => {
      isAnimating = true;
      
      spawnPetals(btnX, btnY);
      ui.classList.remove('show');
      setTimeout(() => { ui.style.display = 'none'; }, 400);
      document.body.classList.add('opened');
      
    }, FILL_DURATION); 
  });

  openBtn.addEventListener('mouseleave', () => {
    if (isAnimating) return;
    openBtn.classList.remove('filling');
    stopTyping();
    clearTimeout(fillTimeout);
  });
</script>
</body>
</html>
