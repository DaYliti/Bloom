<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bloom()</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%; height: 100%;
            background-color: #030303;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            cursor: crosshair;
        }

        /* --- ИНТРО --- */
        #intro-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: #000;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 1.5s ease;
        }
        #intro-video { width: 100%; height: 100%; object-fit: contain; }
        #enter-btn {
            position: absolute; bottom: 15%;
            padding: 15px 50px;
            background: transparent;
            color: #ff6b9e; font-family: 'JetBrains Mono', monospace;
            font-size: 14px; letter-spacing: 0.5em;
            border: 1px solid rgba(255,107,158,0.3);
            border-radius: 2px;
            cursor: crosshair; opacity: 0; pointer-events: none;
            transition: all 0.4s ease;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255,107,158,0);
        }
        #enter-btn.show { opacity: 1; pointer-events: auto; }
        #enter-btn:hover {
            background: #ff6b9e; color: #000;
            box-shadow: 0 0 40px rgba(255,107,158,0.6);
            border-color: #ff6b9e;
        }

        /* --- ФОН (Canvas) --- */
        #bg-canvas {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
        }

        /* --- ЦЕНТРАЛЬНОЕ ЯДРО (Семя) --- */
        #core-seed {
            position: fixed; top: 50%; left: 50%;
            width: 20px; height: 20px;
            background: #ff6b9e;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 10;
            cursor: pointer;
            box-shadow: 0 0 30px #ff6b9e, 0 0 60px #ff6b9e;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s;
            pointer-events: none;
        }
        
        body.site-opened #core-seed {
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 20px #ff6b9e, 0 0 40px #ff6b9e; }
            100% { box-shadow: 0 0 40px #ff6b9e, 0 0 80px #ff6b9e; }
        }

        /* --- ОРБИТАЛЬНАЯ СИСТЕМА --- */
        #orbit-system {
            position: fixed; top: 50%; left: 50%;
            width: 0; height: 0;
            z-index: 5;
            opacity: 0; transition: opacity 1s ease;
        }
        body.bloomed #orbit-system { opacity: 1; }
        body.bloomed #core-seed { transform: translate(-50%, -50%) scale(0); opacity: 0; pointer-events: none; }

        .node {
            position: absolute;
            top: 0; left: 0;
            width: 60px; height: 60px;
            margin: -30px 0 0 -30px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 11px; letter-spacing: 1px; color: #aaa;
            cursor: crosshair;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .node:hover {
            border-color: #ff6b9e;
            color: #fff;
            background: rgba(255,107,158,0.1);
            box-shadow: 0 0 20px rgba(255,107,158,0.4);
            transform: scale(1.1);
        }

        /* Инфо-панель при клике на узел */
        #info-panel {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 400px; max-width: 90%;
            background: rgba(10,10,10,0.9);
            border: 1px solid rgba(255,107,158,0.3);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            z-index: 20;
            opacity: 0; pointer-events: none;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        #info-panel.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
        #info-panel h2 { color: #ff6b9e; font-size: 1.2rem; margin-bottom: 15px; letter-spacing: 2px;}
        #info-panel p { color: #ccc; font-size: 0.9rem; line-height: 1.6; margin-bottom: 20px;}
        #close-info { background: none; border: 1px solid #555; color: #888; padding: 8px 20px; cursor: pointer; font-family: inherit; font-size: 0.8rem; transition: 0.3s;}
        #close-info:hover { border-color: #fff; color: #fff; }

        /* --- ПИКСЕЛЬНЫЙ КОТ (Пасхалка) --- */
        #pixel-cat {
            position: fixed; bottom: 20px; right: 20px;
            color: #555; font-size: 12px; line-height: 1.2;
            white-space: pre; z-index: 50; cursor: crosshair;
            transition: color 0.3s, transform 0.3s;
        }
        #pixel-cat:hover { color: #ff6b9e; transform: scale(1.1); }

        /* --- АУДИО ПЛЕЕР (Заглушка) --- */
        #audio-widget {
            position: fixed; bottom: 20px; left: 20px;
            display: flex; align-items: center; gap: 15px;
            z-index: 50; opacity: 0.6; transition: opacity 0.3s;
        }
        #audio-widget:hover { opacity: 1; }
        .bars { display: flex; gap: 3px; height: 20px; align-items: flex-end; }
        .bar { width: 3px; background: #ff6b9e; height: 5px; }
        .track-info { font-size: 10px; color: #888; letter-spacing: 1px; }
    </style>
</head>
<body>

    <!-- ИНТРО -->
    <div id="intro-screen">
        <video id="intro-video" src="Intro.mp4" autoplay muted playsinline></video>
        <button id="enter-btn">Enter Void</button>
    </div>

    <canvas id="bg-canvas"></canvas>

    <!-- Семя в центре -->
    <div id="core-seed"></div>

    <!-- Орбитальные узлы -->
    <div id="orbit-system">
        <div class="node" style="transform: translate(150px, 0);" onclick="showInfo('me')">INFO</div>
        <div class="node" style="transform: translate(-150px, 0);" onclick="showInfo('tg')">TG</div>
        <div class="node" style="transform: translate(0, 150px);" onclick="showInfo('dc')">DC</div>
        <div class="node" style="transform: translate(0, -150px);" onclick="showInfo('games')">GAMES</div>
        <div class="node" style="transform: translate(106px, -106px);" onclick="showInfo('steam')">STEAM</div>
        <div class="node" style="transform: translate(-106px, 106px);" onclick="showInfo('tiktok')">TT</div>
    </div>

    <!-- Окно информации -->
    <div id="info-panel">
        <h2 id="info-title">Title</h2>
        <p id="info-desc">Description</p>
        <button id="close-info" onclick="closeInfo()">[ CLOSE ]</button>
    </div>

    <!-- Пиксельный кот -->
    <div id="pixel-cat" onmouseenter="catMeow(this)" onmouseleave="catIdle(this)">
/\_/\
( o.o )
 > ^ <
    </div>

    <!-- Аудио виджет -->
    <div id="audio-widget">
        <div class="bars">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <div class="track-info">MUSIC OFFLINE</div>
    </div>

    <script>
        /* 1. ЛОГИКА ИНТРО */
        const video = document.getElementById('intro-video');
        const enterBtn = document.getElementById('enter-btn');
        
        video.addEventListener('ended', () => enterBtn.classList.add('show'));
        setTimeout(() => enterBtn.classList.add('show'), 11000);

        enterBtn.addEventListener('click', () => {
            document.body.classList.add('site-opened');
            setTimeout(() => {
                document.getElementById('intro-screen').style.display = 'none';
                // Запускаем анимацию лепестков только после закрытия интро
                initParticles();
            }, 1500);
        });

        /* 2. ИНТЕРАКТИВНЫЕ ЛЕПЕСТКИ НА CANVAS */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let mouse = { x: -1000, y: -1000 };

        function initParticles() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            
            particles = [];
            for(let i = 0; i < 100; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 3 + 1,
                    speedX: Math.random() * 1 - 0.5,
                    speedY: Math.random() * -1 - 0.5,
                    color: `rgba(255, 107, 158, ${Math.random() * 0.5 + 0.1})`
                });
            }
            animate();
        }

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                // Движение
                p.x += p.speedX;
                p.y += p.speedY;

                // Отталкивание от мыши
                let dx = mouse.x - p.x;
                let dy = mouse.y - p.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < 150) {
                    p.x -= dx * 0.02;
                    p.y -= dy * 0.02;
                }

                // Респавн
                if(p.y < -10 || p.x < -10 || p.x > width + 10) {
                    p.y = height + 10;
                    p.x = Math.random() * width;
                }

                // Рисование
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }

        /* 3. ВЗРЫВ СЕМЕНИ И ОРБИТА */
        const core = document.getElementById('core-seed');
        core.addEventListener('click', () => {
            document.body.classList.add('bloomed');
            // Эффект взрыва (упрощенный)
            for(let i=0; i<50; i++) {
                let particle = document.createElement('div');
                particle.style.position = 'fixed';
                particle.style.left = '50%';
                particle.style.top = '50%';
                particle.style.width = '4px';
                particle.style.height = '4px';
                particle.style.background = '#ff6b9e';
                particle.style.borderRadius = '50%';
                particle.style.pointerEvents = 'none';
                particle.style.zIndex = '99';
                document.body.appendChild(particle);

                let angle = Math.random() * Math.PI * 2;
                let dist = Math.random() * 200 + 50;
                let tx = Math.cos(angle) * dist;
                let ty = Math.sin(angle) * dist;

                particle.animate([
                    { transform: `translate(-50%, -50%) scale(1)`, opacity: 1 },
                    { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`, opacity: 0 }
                ], { duration: 1000, easing: 'cubic-bezier(0.1, 0.8, 0.2, 1)' }).onfinish = () => particle.remove();
            }
        });

        // Вращение орбиты
        let angle = 0;
        function rotateOrbit() {
            if(document.body.classList.contains('bloomed')) {
                angle += 0.002;
                document.getElementById('orbit-system').style.transform = `translate(-50%, -50%) rotate(${angle}rad)`;
                // Чтобы текст не переворачивался, отменяем вращение внутри узлов
                document.querySelectorAll('.node').forEach(node => {
                    // Примечание: тут мы фиксируем расположение узлов в CSS, 
                    // поэтому вращение работает только для самого контейнера.
                    // В идеале нужно использовать JS для вычисления позиций, 
                    // но для простоты мы оставим статичные координаты и просто 
                    // добавим пульсацию.
                });
            }
            requestAnimationFrame(rotateOrbit);
        }
        rotateOrbit();

        /* 4. ИНФО-ПАНЕЛЬ */
        const infoData = {
            'me': { title: 'Ворсинка (Денис)', desc: '16 лет. Исследую цифровое пространство. Люблю игры, хорошую музыку и минимализм.' },
            'tg': { title: 'Telegram', desc: '@DaYliti\n\nНажми, чтобы скопировать.', link: 'https://t.me/DaYliti' },
            'dc': { title: 'Discord', desc: 'vvariozunf\n\nНажми, чтобы скопировать.' },
            'games': { title: 'Games', desc: 'Valorant\nRoblox\nArknights: Endfield\nR.E.P.O.\nHonkai: Star Rail' },
            'steam': { title: 'Steam', desc: 'DaYliti\n\nНажми, чтобы перейти в профиль.', link: 'https://steamcommunity.com/profiles/76561199741654298/' },
            'tiktok': { title: 'TikTok', desc: '@dayliti\n\nНажми, чтобы перейти.', link: 'https://www.tiktok.com/@dayliti' }
        };

        function showInfo(key) {
            const panel = document.getElementById('info-panel');
            const title = document.getElementById('info-title');
            const desc = document.getElementById('info-desc');
            const data = infoData[key];

            title.innerText = data.title;
            desc.innerText = data.desc;
            
            // Обработка копирования или перехода
            desc.onclick = () => {
                if(key === 'tg') { navigator.clipboard.writeText('@DaYliti'); desc.innerText = 'Скопировано!'; }
                if(key === 'dc') { navigator.clipboard.writeText('vvariozunf'); desc.innerText = 'Скопировано!'; }
                if(data.link) { window.open(data.link, '_blank'); }
            };
            desc.style.cursor = (data.link || key==='tg' || key==='dc') ? 'pointer' : 'default';

            panel.classList.add('active');
        }

        function closeInfo() {
            document.getElementById('info-panel').classList.remove('active');
        }

        /* 5. ПИКСЕЛЬНЫЙ КОТ */
        function catMeow(el) {
            el.innerText = "/\\_/\\\n( ^.^ )\n > ^ <\nМяу!";
            el.style.color = "#ff6b9e";
        }
        function catIdle(el) {
            el.innerText = "/\\_/\\\n( o.o )\n > ^ <";
            el.style.color = "#555";
        }

        /* 6. АНИМАЦИЯ ЭКВАЛАЙЗЕРА */
        const bars = document.querySelectorAll('.bar');
        setInterval(() => {
            bars.forEach(bar => {
                bar.style.height = Math.random() * 20 + 3 + 'px';
            });
        }, 150);

    </script>
</body>
</html>
